# GitHub Actions workflow to build Debian packages for amd64, arm64, and armhf
# This workflow uses docker containers for cross-building using debian images

name: Build Debian Packages

on:
  workflow_dispatch:
  push:
    branches: [ deb-package ]
  pull_request:
    branches: [ deb-package ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cross: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armhf
            runner: ubuntu-latest
            cross: true
    name: Build for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build dependencies (native)
        if: matrix.cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper-compat lintian scdoc libpango1.0-dev libxkbcommon-dev libwayland-dev
      - name: Build binary package (native)
        if: matrix.cross == false
        run: |
          export DEB_BUILD_OPTIONS=nocheck
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .
      - name: Install build dependencies (cross for armhf)
        if: matrix.cross == true
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper-compat lintian qemu-user-static scdoc \
            libpango1.0-dev:armhf libxkbcommon-dev:armhf libwayland-dev:armhf crossbuild-essential-armhf
      - name: Build binary package (cross for armhf)
        if: matrix.cross == true
        run: |
          export DEB_BUILD_OPTIONS=nocheck
          dpkg-buildpackage -us -uc -b -aarmhf
          mv ../*.deb .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: "*.deb"
