# GitHub Actions workflow to build Debian packages for amd64, arm64, and armhf
# This workflow uses docker containers for cross-building using debian images

name: Build Debian Packages

on:
  workflow_dispatch:
  push:
    branches: [ deb-package ]
  pull_request:
    branches: [ deb-package ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            container: ubuntu:noble
          - arch: arm64
            container: arm64v8/ubuntu:noble
          - arch: armhf
            container: arm32v7/ubuntu:noble
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install dependencies for git and sudo
        run: apt-get update && apt-get install -y git sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential devscripts debhelper-compat lintian scdoc libpango1.0-dev libxkbcommon-dev libwayland-dev

      - name: Build binary package
        run: |
          export DEB_BUILD_OPTIONS=nocheck
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: "*.deb"
