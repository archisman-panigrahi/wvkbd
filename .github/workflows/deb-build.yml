# GitHub Actions workflow to build Debian packages for amd64, arm64, and armhf
# This workflow uses docker containers for cross-building using debian images

name: Build Debian Packages

on:
  workflow_dispatch:
  push:
    branches: [ deb-package ]
  pull_request:
    branches: [ deb-package ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, armhf]
    name: Build for ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install -y build-essential devscripts debhelper-compat lintian qemu-user-static libpango1.0-dev libxkbcommon-dev libwayland-dev scdoc
          else
            sudo dpkg --add-architecture ${{ matrix.arch }}
            sudo apt-get update
            sudo apt-get install -y build-essential devscripts debhelper-compat lintian qemu-user-static scdoc \
              libpango1.0-dev:${{ matrix.arch }} libxkbcommon-dev:${{ matrix.arch }} libwayland-dev:${{ matrix.arch }}
          fi

      - name: Build binary package (cross-build)
        run: |
          sudo apt-get install -y crossbuild-essential-${{ matrix.arch }}
          export DEB_BUILD_OPTIONS=nocheck
          dpkg-buildpackage -us -uc -b -a${{ matrix.arch }}
          mv ../*.deb .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: "*.deb"
